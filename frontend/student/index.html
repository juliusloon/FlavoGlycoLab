<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="从异槲皮苷出发，探索三种生物制造思路，作出自己的实验判断。">
<title>FlavoGlycoLab · 虚拟探究实验</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./inquiry-tools.css"><link rel="stylesheet" href="./components.css"><link rel="stylesheet" href="./paper-notebook.css"><script type="module" src="./app.js"></script>
</head>
<body>
<a class="skip-link" href="#main-content">跳至实验操作</a>
<div class="workspace"><div class="left-dock"><div class="sidebar-sections"><aside class="quest-panel" id="quest-panel" aria-label="主线任务"></aside><aside class="workflow" aria-label="实验历程" id="workflow"></aside></div></div><main id="main-content" tabindex="-1"><p class="loading">正在准备实验空间…</p></main></div>
<footer data-site-controls></footer>
<aside class="tutor" id="tutor-panel" popover="manual" aria-label="AI 实验导师" hidden><div class="tutor-heading"><div><h2>AI 实验导师</h2><span id="ai-status">连接检查中</span></div><button id="close-tutor" class="close-button" aria-label="收起 AI 导师">×</button></div><p class="tutor-context" id="tutor-context"></p><p class="independent-status" id="independent-status" role="status"></p><div id="chat" role="log" aria-label="辅导对话" aria-live="polite"></div><div class="tutor-bottom"><button id="suggest-question" class="suggestion"></button><p class="ai-error" id="ai-error" role="status"></p><form id="chat-form"><label class="sr-only" for="question">给 AI 导师的问题</label><textarea id="question" placeholder="把你的想法或困惑告诉我…" rows="3" maxlength="2000" required></textarea><button type="submit" id="send-question" aria-label="发送问题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 18-7-7 18-3-8-8-3Zm8 3L21 3"/></svg></button></form><p class="tutor-note">Enter 发送 · Shift + Enter 换行</p></div></aside>
<div id="feedback" role="status" aria-live="polite" hidden></div>
<dialog id="paper-notebook" aria-label="论文笔记本"></dialog>
<button type="button" id="notebook-launcher" class="notebook-launcher" aria-label="论文笔记本" title="论文笔记本" aria-expanded="false" aria-controls="paper-notebook"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h13a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z M8 3v18 M2 7h4 M2 12h4 M2 17h4 M12 8h4 M12 12h4"/></svg></button>
<dialog id="evidence-dialog" aria-labelledby="evidence-title"></dialog>
<button type="button" class="tutor-launcher" id="tutor-launcher" popover="manual" aria-label="AI 实验导师" title="AI 实验导师" aria-expanded="false" aria-controls="tutor-panel"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-8l-6 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg></button>
<dialog id="route-change-dialog" aria-labelledby="route-change-title"><form method="dialog"><h2 id="route-change-title">切换实验路线？</h2><p>更换路线将清空当前路线的全部主线进度（01—24）、方案与操作记录，并从头开始。确定更换？</p><div class="actions"><button class="button secondary" value="cancel">继续比较</button><button class="button primary" value="confirm">切换并重新探究</button></div></form></dialog>
<dialog id="confirm-dialog"><form method="dialog"><h2>开始新实验？</h2><p id="new-description">当前草稿将被清空；已保存的练习记录仍保留。</p><div class="actions"><button class="button secondary" value="cancel">继续当前实验</button><button class="button primary" value="confirm">开始新实验</button></div></form></dialog>
<dialog id="open-warning-dialog" aria-labelledby="open-warning-title"><form method="dialog"><h2 id="open-warning-title">条件与文献参照不同</h2><div class="warning-list" role="alert"></div><p class="fine-print">条件差异由系统核对，实际影响尚待实验验证。</p><div class="actions"><button class="button secondary" value="abandon" data-open-decision="abandon">放弃本次修改</button><button class="button secondary" value="redo" data-open-decision="redo">重来本阶段</button><button class="button primary" value="continue" data-open-decision="continue">警告后继续</button></div></form></dialog>
<dialog id="redo-dialog" aria-labelledby="redo-title"><form method="dialog"><h2 id="redo-title">重来本阶段？</h2><p>当前方案将保存为快照。本阶段输入与完成记录保留，下游结果和旧 AI 回复失效。确认重来？</p><div class="actions"><button class="button secondary" value="cancel">取消</button><button class="button primary" value="confirm">重来本阶段</button></div></form></dialog>
<dialog id="retro-import-dialog" aria-labelledby="retro-import-title"><header class="dialog-heading"><h2 id="retro-import-title">导入逆合成来源</h2><button class="close-button" data-retro-close aria-label="关闭交接">×</button></header><label class="retro-file-label">导入交接文件<input type="file" accept=".json,application/json"></label><div class="retro-import-body"></div><p role="status" aria-live="polite"></p><button class="button primary" data-retro-accept hidden>附到当前练习</button></dialog><noscript>请启用 JavaScript 使用实验空间。</noscript>
</body></html>
